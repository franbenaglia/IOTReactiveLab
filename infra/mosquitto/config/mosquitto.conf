# Mosquitto 2.0 — IoT Reactive Lab. Ver ADR-005 y ADR-007.

# Un único listener, accesible desde la LAN para el ESP32 (el puerto lo publica
# docker-compose). Sin TLS: alcance LAN, nunca exponer a Internet.
listener 1883 0.0.0.0
protocol mqtt

# Autenticación obligatoria. El archivo de contraseñas lo genera entrypoint.sh
# al arrancar, desde variables de entorno: no existe en el repo.
allow_anonymous false
password_file /mosquitto/run/passwd
acl_file /mosquitto/run/acl

# Retained (status) y sesiones persistentes sobreviven a reinicios del broker.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Límites. max_inflight: mensajes QoS 1 en vuelo por cliente hacia los
# suscriptores. max_queued: cola por cliente lento antes de descartar. Son
# límites explícitos, no infinitos (ver main.md §7).
max_connections -1
max_inflight_messages 100
max_queued_messages 10000

# Estadísticas en $SYS cada 10 s (las usa el healthcheck y sirven para
# comparar con lo que reporta el simulador).
sys_interval 10

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp_format %Y-%m-%dT%H:%M:%S
# Con 1.000 dispositivos, un log por conexión inunda la salida. Poner en true
# para depurar conexiones puntuales.
connection_messages false
