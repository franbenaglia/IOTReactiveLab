# Mosquitto para pruebas (Testcontainers). Sin autenticación: el contenedor es
# efímero y solo accesible desde el puerto aleatorio que asigna Testcontainers.
listener 1883
allow_anonymous true
persistence false
max_inflight_messages 100
max_queued_messages 10000
log_dest stdout
log_type error
log_type warning
log_type notice
